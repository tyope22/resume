<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend request</title>
    <style>
        body {
            background-color: #FCE4EC; /* Light pink */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars if the button jumps */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #FFFFFF;
            padding: 50px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative; /* Container is the boundary for the No button */
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .owl-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #000000;
            font-size: 28px;
            margin: 20px 0 40px 0;
            font-weight: 700;
        }

        /* The clickable area for Yes */
        #yesBtn {
            background-color: #E91E63; /* Deep pink */
            color: #FFFFFF;
            border: none;
            padding: 12px 35px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 1;
        }

        /* The elusive No button */
        #noBtn {
            background-color: #F5F5F5;
            color: #424242;
            border: none;
            padding: 8px 20px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            position: absolute; /* Moves relative to .container */
            transition: all 0.1s ease; /* Smooth jump */
            z-index: 2;
        }

        .footer-text {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #9E9E9E;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="owl-icon">🦉🧡</div>
        <h1>Hey you! Will you be my friend?</h1>

        <button id="yesBtn" onclick="celebrate()">Yes</button>
        
        <button id="noBtn" style="top: 275px;">No</button>

        <p class="footer-text">"No" seems a bit shy 😈</p>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const container = document.getElementById('mainContainer');

        const moveButton = () => {
            // Get dimensions of the white container
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;
            
            // Get dimensions of the button itself
            const btnWidth = noBtn.offsetWidth;
            const btnHeight = noBtn.offsetHeight;

            // Calculate new random position strictly INSIDE the white box
            // We subtract button size so it doesn't bleed over the edge
            const newX = Math.floor(Math.random() * (containerWidth - btnWidth));
            const newY = Math.floor(Math.random() * (containerHeight - btnHeight));

            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;
        };

        // Trigger move on hover/touch
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents "phantom clicks" on mobile
            moveButton();
        });

        function celebrate() {
            container.innerHTML = `
                <div class="owl-icon">💖</div>
                <h1 style="color: #E91E63;">Yay! See you soon!</h1>
                <p>Prepare for the best party.</p>
            `;
        }
    </script>
</body>
</html>
