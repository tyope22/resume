<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friend request</title>
    <style>
        body {
            background-color: #FCE4EC; /* Light pink */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevents scrollbars if the button jumps */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: #FFFFFF;
            padding: 50px 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            text-align: center;
            width: 90%;
            max-width: 450px;
            position: relative; /* Container is the boundary for the No button */
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        position: relative; /* This keeps the 'No' button trapped inside the box */
        min-height: 450px;  /* Gives the button enough room to jump around */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        
        .owl-icon {
            font-size: 60px;
            margin-bottom: 10px;
        }

        h1 {
            color: #000000;
            font-size: 28px;
            margin: 20px 0 40px 0;
            font-weight: 700;
        }

        /* The clickable area for Yes */
        #yesBtn {
            background-color: #E91E63; /* Deep pink */
            color: #FFFFFF;
            border: none;
            padding: 12px 35px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            z-index: 1;
        }

        /* The elusive No button */
        #noBtn {
            background-color: #F5F5F5;
            color: #424242;
            border: none;
            padding: 8px 20px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            position: absolute; /* Moves relative to .container */
            transition: all 0.15s ease; /* Smooth jump */
            z-index: 2;
            
            .footer-text {
            position: absolute;
            bottom: 20px;
            font-size: 13px;
            color: #9E9E9E;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div class="owl-icon">🦉🧡</div>
        <h1>Hey you! Will you be my friend?</h1>

        <button id="yesBtn" onclick="celebrate()">Yes</button>
        <button id="noBtn" style="top: 300px;">No</button>

        <p class="footer-text">"No" seems a bit shy 😈</p>
    </div>
<script>
    const noBtn = document.getElementById('noBtn');
    const container = document.getElementById('mainContainer'); // Make sure your container has id="mainContainer"

// 1. Set your phone number here (International format, no +)
    const MY_PHONE = "917859043592"; 

    const moveButton = () => {
    // This calculates the box limits
    const containerWidth = container.offsetWidth;
    const containerHeight = container.offsetHeight;

    // Randomly pick a spot strictly inside the white container
    const newX = Math.floor(Math.random() * (containerWidth - noBtn.offsetWidth));
    const newY = Math.floor(Math.random() * (containerHeight - noBtn.offsetHeight));

    noBtn.style.left = `${newX}px`;
    noBtn.style.top = `${newY}px`;
};

// Moves on hover and on mobile touch
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); 
    moveButton();
});

    function celebrate() {
    // Change screen text
    container.innerHTML = `<h1 style="color: #E91E63;">Yay! Messaging you now... ❤️</h1>`;

    // Redirect to WhatsApp
    const message = encodeURIComponent("Yes! I will be your valentine! ❤️");
    setTimeout(() => {
        window.location.href = `https://wa.me/${MY_PHONE}?text=${message}`;
    }, 1000);
}
    </script>
</body>
</html>
